name: Bug report
description: Report a reproducible problem in a FormKnot package
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@formknot/core"
        - "@formknot/react"
        - "@formknot/builder-react"
        - Demo app / documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @formknot/core @formknot/react @formknot/builder-react` (or the version in your lockfile)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        Steps to reproduce, ideally with a minimal FormKnotSchema and the code that renders/builds it.
        A link to a small reproduction repo or StackBlitz is very helpful.
      placeholder: |
        1. Schema: { ... }
        2. Render with <FormKnotForm ... />
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, browser (if relevant), React version, OS.
      placeholder: |
        Node: 20.x
        React: 18.3.1
        Browser: Chrome 128
        OS: macOS 14
    validations:
      required: true

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact (if applicable)
      description: Does this bug affect keyboard operation, screen reader announcements, or focus management?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Console errors, screenshots, or anything else relevant.
    validations:
      required: false
